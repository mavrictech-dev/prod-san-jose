{
  "name": "factuez-core-production-review",
  "x-contract": {
    "scope": "Native 01/03, production notes and corporate SMTP. Server flags installed; RUC grants must remain absent until human approval.",
    "memoryBudgetBytes": 8000000000,
    "memoryTotalBytes": 7700000000,
    "cpuTotal": 8.5,
    "readiness": "Liveness is not fiscal/SMTP readiness. Current per-RUC grants and authenticated readiness mandatory.",
    "initialization": "Pre-initialized PGDATA; no database migrate/seed services. Native RBAC upserts plus ONE TI-configured initial human admin on fresh empty Identity; no demo or business seed.",
    "b2b": "NOT_ASSEMBLED; native core only. B2B/OnPrem/readonly flags false.",
    "manualDdlOnly": true
  },
  "services": {
    "postgres": {
      "image": "${CORE_POSTGRES_IMAGE:?TI approved value required}",
      "pull_policy": "never",
      "restart": "unless-stopped",
      "mem_limit": 1400000000,
      "memswap_limit": 1400000000,
      "cpus": 1.5,
      "pids_limit": 160,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "stop_grace_period": "60s",
      "user": "postgres",
      "entrypoint": [
        "postgres"
      ],
      "command": [
        "-D",
        "/var/lib/postgresql/data",
        "-c",
        "listen_addresses=*",
        "-c",
        "shared_buffers=384MB",
        "-c",
        "work_mem=8MB",
        "-c",
        "max_connections=100",
        "-c",
        "hba_file=/etc/postgresql/pg_hba.conf"
      ],
      "environment": {
        "TZ": "America/Lima"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "${CORE_ROOT:?TI approved value required}/data/postgres",
          "target": "/var/lib/postgresql/data",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "${CORE_ROOT:?TI approved value required}/config/pg_hba.conf",
          "target": "/etc/postgresql/pg_hba.conf",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "private-db"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-p",
          "5432",
          "-U",
          "${CORE_PG_ADMIN_USER:?TI approved value required}",
          "-d",
          "postgres"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 10,
        "start_period": "30s"
      }
    },
    "redis": {
      "image": "${CORE_REDIS_IMAGE:?TI approved value required}",
      "pull_policy": "never",
      "restart": "unless-stopped",
      "mem_limit": 450000000,
      "memswap_limit": 450000000,
      "cpus": 0.5,
      "pids_limit": 160,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "stop_grace_period": "60s",
      "user": "1000:1000",
      "command": [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--aclfile",
        "/run/secrets/redis_acl",
        "--maxmemory",
        "268435456",
        "--maxmemory-policy",
        "noeviction",
        "--save",
        ""
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "${CORE_ROOT:?TI approved value required}/data/redis",
          "target": "/data",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "secrets": [
        "redis_acl",
        "redis_password"
      ],
      "networks": [
        "private-db"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli --no-auth-warning ping | grep -qx PONG"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 10,
        "start_period": "15s"
      }
    },
