        "PORT": "3001",
        "NODE_OPTIONS": "--max-old-space-size=384",
        "DB_NAME": "factuez_identity",
        "DB_USER": "factuez_identity",
        "DB_PASSWORD_FILE": "/run/secrets/identity_db_password",
        "JWT_PRIVATE_KEY_FILE": "/run/secrets/jwt_private_key",
        "JWT_ACCESS_TOKEN_TTL_SECONDS": "900",
        "AUTH_BROWSER_ORIGINS": "${CORE_HTTPS_ORIGIN:?TI approved value required}",
        "INITIAL_ADMIN_USERNAME": "${CORE_INITIAL_ADMIN_USERNAME:?TI approved human administrator username required}",
