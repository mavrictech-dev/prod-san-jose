{
  "name": "factuez-san-jose-test",
  "x-contract": {
    "scope": "Windows 11 Pro local test installation; no official fiscal or external mail transmission",
    "newDatabasesOnly": true,
    "memoryBudgetBytes": 8000000000,
    "firstAdmin": "Explicit local bootstrap; disable after first login"
  },
  "services": {
    "postgres": {
      "image": "postgres:17-alpine",
      "restart": "unless-stopped",
      "mem_limit": 1400000000,
      "memswap_limit": 1400000000,
      "cpus": 1.5,
      "pids_limit": 160,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "security_opt": [
        "no-new-privileges:true"
      ],
      "stop_grace_period": "60s",
      "command": [
        "postgres",
        "-c",
        "shared_buffers=384MB",
        "-c",
        "work_mem=8MB",
        "-c",
        "max_connections=100"
      ],
      "environment": {
        "TZ": "America/Lima",
        "POSTGRES_DB": "postgres",
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD_FILE": "/run/secrets/postgres_admin_password"
      },
      "volumes": [
        {
          "type": "volume",
          "source": "pgdata",
          "target": "/var/lib/postgresql/data"
        },
        {
          "type": "bind",
          "source": "./init-postgres.sh",
          "target": "/docker-entrypoint-initdb.d/01-init.sh",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "../../../.installation/windows-test/schemas",
          "target": "/schema",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "private-db"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "test -f /var/lib/postgresql/data/factuez-schema-ready && pg_isready -h 127.0.0.1 -U postgres -d postgres"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 40,
        "start_period": "60s"
      },
      "secrets": [
        "postgres_admin_password",
        "identity_db_password",
        "billing_db_password",
        "sunat_db_password",
        "mailer_db_password",
        "received_db_password"
      ]
    },
    "redis": {
      "image": "redis:7.4-alpine",
      "restart": "unless-stopped",
      "mem_limit": 450000000,
      "memswap_limit": 450000000,
      "cpus": 0.5,
      "pids_limit": 160,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "stop_grace_period": "60s",
      "user": "1000:1000",
      "command": [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--aclfile",
        "/run/secrets/redis_acl",
        "--maxmemory",
        "268435456",
        "--maxmemory-policy",
        "noeviction",
        "--save",
        ""
      ],
      "volumes": [
        {
          "type": "volume",
          "source": "redis_data",
          "target": "/data",
          "volume": {
            "nocopy": true
          }
        }
      ],
      "secrets": [
        "redis_acl",
        "redis_password"
      ],
      "networks": [
        "private-db"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli --no-auth-warning ping | grep -qx PONG"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 10,
        "start_period": "15s"
      },
      "depends_on": {
        "prepare-volumes": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "identity-service": {
      "image": "factuez-windows-test/identity-service:local",
