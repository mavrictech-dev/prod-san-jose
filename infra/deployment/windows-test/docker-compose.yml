        "INTEGRATION_BILLING_CAPTURE_ENABLED": "false",
        "INTEGRATION_BILLING_CHANGES_ENABLED": "false",
        "CLIENT_INTAKE_QA_ENABLED": "false",
        "FISCAL_CIRCUIT_QA_ENABLED": "false",
        "FISCAL_BATCH_QA_ENABLED": "false",
        "GRE_QA_ENABLED": "false",
        "GRE_EXTERNAL_TRANSMISSION_ENABLED": "false",
        "NOTES_QA_ENABLED": "false",
        "SUNAT_BETA_WORKFLOW_ENABLED": "false",
        "SUNAT_BETA_TRANSMISSION_ENABLED": "false",
        "LOCAL_XML_VALIDATION_ENABLED": "false",
