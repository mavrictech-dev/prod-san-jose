        "BILLING_PRODUCTION_BATCHES_ENABLED": "false",
        "BILLING_PRODUCTION_GUIDES_ENABLED": "false"
      },
      "secrets": [
        "redis_password",
        "jwt_public_key",
        "internal_service_token",
        "identity_db_password",
        "jwt_private_key",
        "initial_admin_password"
      ],
      "networks": [
        "private-db",
        "core"
      ],
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,noexec,size=201326592,mode=1777"
      ],
      "read_only": true,
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "redis": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health',{signal:AbortSignal.timeout(3000),redirect:'error'}).then(r=>{r.body?.cancel();process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 5,
        "start_period": "45s"
      },
      "build": {
        "context": "../../..",
        "dockerfile": "docker/Dockerfile.service",
        "args": {
          "SERVICE_NAME": "@factuez/identity-service",
          "SERVICE_PATH": "services/identity-service"
        }
      }
    },
