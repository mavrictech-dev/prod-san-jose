_format_version: "3.0"
_transform: true

services:
  - name: identity-service
    url: http://identity-service:3001
    routes:
      - name: identity-route
        paths: [/api/v1/auth, /api/v1/users, /api/v1/roles]
        strip_path: false

  - name: billing-service
    url: http://billing-service:3002
    routes:
      - name: billing-route
        paths: [/api/v1/documents, /api/v1/stations]
        strip_path: false

  - name: sunat-service
    url: http://sunat-service:3003
    routes:
      - name: fiscal-artifacts-route
        paths: [/api/v1/fiscal-artifacts, /api/v1/setup/sunat, /api/v1/local-xml-validation, /api/v1/fiscal-circuit-qa, /api/v1/fiscal-rules]
        strip_path: false
      - name: sunat-health-route
        paths: [/sunat-health]
        strip_path: true

  - name: web-pwa
    url: http://web-pwa:3000
    routes:
      - name: web-route
        paths: [/]
        strip_path: false

plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true
