_format_version: "3.0"
_transform: true
services:
  - name: received-documents-service
    url: http://received-documents-service:3006
    routes:
      - name: received-documents-route
        paths: [/api/v1/received-documents]
        strip_path: false
  - name: identity-service
    url: http://identity-service:3001
    routes:
      - name: identity-route
        paths: [/api/v1/auth, /api/v1/users, /api/v1/roles, /api/v1/b2b-admin]
        strip_path: false
  - name: billing-service
    url: http://billing-service:3002
    routes:
      - name: billing-route
        paths: [/api/v1/documents, /api/v1/stations]
        strip_path: false
  - name: sunat-service
    url: http://sunat-service:3003
    routes:
      - name: fiscal-artifacts-route
        paths: [/api/v1/fiscal-artifacts, /api/v1/setup/sunat, /api/v1/local-xml-validation, /api/v1/fiscal-circuit-qa, /api/v1/fiscal-batch-qa, /api/v1/notes-qa, /api/v1/gre-qa, /api/v1/fiscal-rules, /api/v1/fiscal-evidence]
        strip_path: false
  - name: sunat-health-service
    url: http://sunat-service:3003/health
    routes:
      - name: sunat-health-route
        paths: [/sunat-health]
        strip_path: true
  - name: mailer-worker
    url: http://mailer-worker:3004
    routes:
      - name: local-mail-qa
        paths: [/api/v1/mail-qa, /api/v1/mail-settings]
        strip_path: false
  - name: realtime-service
    url: http://realtime-service:3005
    routes:
      - name: socket-io-qa
        paths: [/socket.io]
        strip_path: false
        protocols: [http, https]
  - name: web-pwa
    url: http://web-pwa:3000
    routes:
      - name: web-route
        paths: [/]
        strip_path: false
plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true
