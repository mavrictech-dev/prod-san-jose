# REVIEW FRAGMENT ONLY: integrate manually in the existing HTTPS subdomain
# server after TI approval. Do not create a second server or change listeners,
# certificate paths, firewall, other vhosts, or install nginx automatically.
# B2B and operator mTLS ingress require a separate reviewed design.
location ^~ /internal/ { return 404; }
location ^~ /b2b/ { return 503; }
location / {
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # This is the TLS terminating server, not a trusted client header.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    client_max_body_size 18m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
