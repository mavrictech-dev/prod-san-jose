packages:
  - apps/*
  - services/*
  - packages/*

# Dependencias revisadas que requieren ejecutar su postinstall durante el
# build de imágenes: Prisma genera el cliente y Sharp descarga su binario.
allowBuilds:
  # Telemetría de instalación transitiva de Swagger UI: no es necesaria y no se ejecuta.
  "@scarf/scarf": false
  "@nestjs/core": true
  "@prisma/engines": true
  "msgpackr-extract": true
  "prisma": true
  "sharp": true
